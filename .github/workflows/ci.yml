name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit

      - name: Compile & security scan
        run: |
          python -m compileall -q app scripts tests
          bandit -r app/ -ll

      - name: Run automated test suite
        run: pytest tests/ -v

  minimum-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared minimum dependency versions
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi==0.115.6 \
            uvicorn==0.27.0 \
            pydantic==2.10.0 \
            pydantic-settings==2.1.0 \
            httpx==0.28.1 \
            beautifulsoup4==4.12.0 \
            python-dotenv==1.0.0 \
            python-multipart==0.0.9 \
            ddgs==9.0.0 \
            google-genai==1.60.0 \
            openai==1.58.0 \
            anthropic==0.77.0 \
            pytest==8.0.0

      - name: Verify minimum SDK compatibility and tests
        run: |
          python -m compileall -q app scripts tests
          pytest tests/ -v
